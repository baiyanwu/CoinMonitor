<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CoinMonitor Android · 最终四页设计 · 紧凑版</title>
  <style>
    :root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#282c3e;background:#f5f6f9}
    *{box-sizing:border-box}body{margin:0;padding:32px 24px 44px}main{max-width:1600px;margin:auto}header{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:26px}h1{font-size:22px;font-weight:650;margin:0 0 9px}p{font-size:14px;color:#7c8297;line-height:1.6;margin:0}.tag{padding:9px 14px;border-radius:99px;background:#eceaf8;color:#6863aa;font-size:13px;white-space:nowrap}.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}figure{margin:0;min-width:0}figcaption{display:flex;align-items:center;gap:9px;margin:0 0 12px;font-size:15px;font-weight:600}.number{font-size:12px;color:#7c8297;font-weight:400}.image-link{display:block;border-radius:28px;overflow:hidden;background:#fff;box-shadow:0 8px 28px #282c3e08}img{display:block;width:100%;height:auto}.image-link:focus-visible{outline:3px solid #8e88f8;outline-offset:5px}footer{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:25px;font-size:13px;color:#7c8297}footer a{color:#6863aa;text-underline-offset:3px}@media(max-width:1050px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;max-width:850px;margin:auto}}@media(max-width:560px){body{padding:22px 16px}.gallery{grid-template-columns:1fr;max-width:400px}header{display:block}.tag{display:inline-block;margin-top:14px}}
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>CoinMonitor Android · 最终四页设计 · 紧凑版</h1><p>圆润蓝紫 · 紧凑版 · 行情 / 热门 / 钱包 / 设置 · 点击图片查看原图</p></div>
      <span class="tag">2026-10-09 · 紧凑最终稿</span>
    </header>
    <section class="gallery" aria-label="四个主 Tab 的最终设计稿">
      <figure><figcaption><span class="number">01</span>行情</figcaption><a class="image-link" href="01-market.png?v=c2a94f64d6cc" aria-label="查看行情原图"><img src="01-market.png?v=c2a94f64d6cc" alt="行情 Tab：自选币种、交易所和链上切换、悬浮盯盘入口" width="853" height="1844"></a></figure>
      <figure><figcaption><span class="number">02</span>热门</figcaption><a class="image-link" href="02-trending.png?v=fe449c26d07e" aria-label="查看热门原图"><img src="02-trending.png?v=fe449c26d07e" alt="热门 Tab：多来源榜单、筛选与共同热门列表" width="853" height="1844"></a></figure>
      <figure><figcaption><span class="number">03</span>钱包</figcaption><a class="image-link" href="03-wallet.png?v=1cf0dc52f45f" aria-label="查看钱包原图"><img src="03-wallet.png?v=1cf0dc52f45f" alt="钱包 Tab：主钱包资产、转账收款、活动和观察地址" width="853" height="1844"></a></figure>
      <figure><figcaption><span class="number">04</span>设置</figcaption><a class="image-link" href="04-settings.png?v=765d24723cf2" aria-label="查看设置原图"><img src="04-settings.png?v=765d24723cf2" alt="设置 Tab：外观、通用、钱包、悬浮窗、第三方 API 和关于" width="853" height="1844"></a></figure>
    </section>
    <footer><span>紧凑设计参考稿 · 图中数据为示例</span><span>DApp 浏览器入口：钱包 → 更多</span><a href="design.json">查看配色与结构说明</a></footer>
  </main>
</body>
</html>
